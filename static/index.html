<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeXify — LaTeX Document Studio</title>

<!-- CodeMirror 5 (stable, full CSS) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

<!-- pdf.js (UMD) for PDF preview -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- mammoth for DOCX -> HTML preview -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
:root{
  --bg:#0f1115; --bg2:#151823; --panel:#1a1e2b; --panel2:#20253a;
  --border:#2a3047; --ink:#e6e9f2; --muted:#8a90a6; --faint:#5a6079;
  --accent:#4f8cff; --accent2:#3b6fd4; --ok:#3fb96b; --err:#e05656;
  --radius:10px; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --sans:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{font-weight:700;font-size:18px;letter-spacing:.5px}
.brand .tex{color:var(--accent)}
.brand .sub{color:var(--faint);font-weight:400;font-size:12px;margin-left:8px}
.topbar .spacer{flex:1}
.status{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:6px;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.ok{color:var(--ok);border-color:#234a33}
.status.err{color:var(--err);border-color:#5a2a2a}

button{font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;
  padding:7px 12px;transition:background .12s,border-color .12s}
button:hover{background:#272d45;border-color:#3a4266}
button.primary{background:var(--accent);border-color:var(--accent2);color:#fff;font-weight:600}
button.primary:hover{background:var(--accent2)}
button:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout ---------- */
.workspace{display:flex;flex:1;min-height:0}

/* sidebar */
.sidebar{width:230px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px 14px;border-bottom:1px solid var(--border)}
.side-head h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.dropzone{border:1.5px dashed var(--border);border-radius:8px;padding:12px;text-align:center;
  color:var(--muted);font-size:12px;cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:#1a2138;color:var(--ink)}
.doc-list{flex:1;overflow-y:auto;padding:8px}
.doc-group{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);
  margin:10px 6px 4px}
.doc-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--ink);border:1px solid transparent}
.doc-item:hover{background:var(--panel)}
.doc-item.active{background:var(--panel2);border-color:var(--accent)}
.doc-item .ext{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto}
.empty{color:var(--faint);font-size:12px;padding:14px;text-align:center}

/* panes */
.panes{display:flex;flex:1;min-width:0;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.pane.code{border-right:1px solid var(--border)}
.pane-head{display:flex;align-items:center;gap:10px;padding:8px 14px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex:0 0 auto}
.pane-head .title{font-size:13px;font-weight:600;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-head .fname{font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-head .spacer{flex:1}
.seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:none;background:transparent;border-radius:0;padding:5px 11px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--ink)}
.pane-body{flex:1;min-height:0;position:relative;overflow:auto;background:var(--bg)}

/* CodeMirror fills code pane */
.CodeMirror{height:100%;font-family:var(--mono);font-size:13px;background:var(--bg);color:var(--ink)}
.CodeMirror-gutters{background:var(--bg);border-right:1px solid var(--border)}

/* preview */
.preview-scroll{height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;
  align-items:center;gap:18px}
.page-canvas{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);border-radius:3px;max-width:100%}
.docx-preview{background:#fff;color:#111;border-radius:4px;padding:44px;max-width:760px;
  width:100%;box-shadow:0 4px 24px rgba(0,0,0,.5);font-family:Georgia,serif;line-height:1.55}
.preview-placeholder{color:var(--faint);text-align:center;margin:auto;font-size:14px;line-height:1.7}
.preview-placeholder .big{font-size:40px;margin-bottom:10px}
.plain-preview{font-family:var(--mono);font-size:13px;color:var(--ink);white-space:pre-wrap;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;
  max-width:820px;width:100%}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c3350;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="tex">TeX</span>ify<span class="sub">LaTeX Document Studio</span></div>
    <div class="spacer"></div>
    <div id="status" class="status">ready</div>
    <button id="btn-save">Save</button>
    <button id="btn-compile" class="primary">Compile &amp; Preview</button>
  </div>

  <div class="workspace">
    <!-- sidebar -->
    <aside class="sidebar">
      <div class="side-head">
        <h2>Documents</h2>
        <div id="dropzone" class="dropzone">Drop PDF / DOCX here<br>or click to upload</div>
        <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.tex" style="display:none">
      </div>
      <div id="doc-list" class="doc-list"><div class="empty">no documents</div></div>
    </aside>

    <!-- code pane -->
    <div class="panes">
      <section class="pane code">
        <div class="pane-head">
          <span class="title">LaTeX Source</span>
          <span id="code-fname" class="fname"></span>
        </div>
        <div class="pane-body"><textarea id="editor"></textarea></div>
      </section>

      <!-- preview pane -->
      <section class="pane preview">
        <div class="pane-head">
          <span class="title">Preview</span>
          <span id="prev-fname" class="fname"></span>
          <div class="spacer"></div>
          <div class="seg" id="mode-seg">
            <button data-mode="pdf" class="on">PDF</button>
            <button data-mode="source">Source</button>
          </div>
        </div>
        <div class="pane-body">
          <div id="preview" class="preview-scroll">
            <div class="preview-placeholder">
              <div class="big">&#128196;</div>
              Upload a PDF/DOCX or select a document,<br>then Compile &amp; Preview.
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = s => document.querySelector(s);
const statusEl = $("#status");
let editor, currentTex = null, currentSrc = null, docs = {};
let mode = "pdf";

function setStatus(msg, kind){
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

async function api(path, opts){
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch(e){}
  return { ok: r.ok, status: r.status, data };
}

async function refreshDocs(){
  const { data } = await api("/api/documents");
  docs = (data && data.files) || {};
  renderDocList();
}
function renderDocList(){
  const list = $("#doc-list");
  list.innerHTML = "";
  const order = [".tex", ".pdf", ".docx", ".txt", ".md", ".log"];
  const keys = Object.keys(docs).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  if(!keys.length){ list.innerHTML = '<div class="empty">no documents</div>'; return; }
  for(const ext of keys){
    const g = document.createElement("div");
    g.className = "doc-group"; g.textContent = ext.replace(".","").toUpperCase();
    list.appendChild(g);
    for(const name of docs[ext]){
      const it = document.createElement("div");
      it.className = "doc-item";
      it.innerHTML = `<span>${name}</span><span class="ext">${ext.slice(1)}</span>`;
      it.onclick = ()=> selectDoc(name, ext);
      list.appendChild(it);
    }
  }
}

async function selectDoc(name, ext){
  if(ext === ".tex"){
    const { data } = await api("/api/read?name=" + encodeURIComponent(name));
    if(data && data.content !== undefined){
      currentTex = name;
      editor.setValue(data.content);
      $("#code-fname").textContent = name;
      setStatus("loaded " + name, "ok");
    }
    const pdfName = name.replace(/\.tex$/, ".pdf");
    if((docs[".pdf"]||[]).includes(pdfName)){ renderPdf(pdfName); $("#prev-fname").textContent = pdfName; }
  } else {
    currentSrc = name;
    $("#prev-fname").textContent = name;
    if(ext === ".pdf") renderPdf(name);
    else if(ext === ".docx") renderDocx(name);
    else renderPlain(name);
    setStatus("previewing " + name, "ok");
  }
}

async function renderPdf(name){
  mode = "pdf"; setSeg();
  const pv = $("#preview");
  pv.innerHTML = '<div class="preview-placeholder">rendering PDF...</div>';
  try{
    const doc = await pdfjsLib.getDocument("/api/file?name=" + encodeURIComponent(name)).promise;
    pv.innerHTML = "";
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const vp = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement("canvas");
      canvas.className = "page-canvas";
      canvas.width = vp.width; canvas.height = vp.height;
      pv.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    }
    setStatus(`PDF: ${doc.numPages} page(s)`, "ok");
  }catch(e){ pv.innerHTML = '<div class="preview-placeholder">PDF render failed</div>'; setStatus("pdf render failed","err"); }
}

async function renderDocx(name){
  const pv = $("#preview");
  pv.innerHTML = '<div class="preview-placeholder">rendering DOCX...</div>';
  try{
    const buf = await (await fetch("/api/file?name=" + encodeURIComponent(name))).arrayBuffer();
    const res = await mammoth.convertToHtml({ arrayBuffer: buf });
    pv.innerHTML = `<div class="docx-preview">${res.value}</div>`;
    setStatus("DOCX preview", "ok");
  }catch(e){ pv.innerHTML = '<div class="preview-placeholder">DOCX render failed</div>'; setStatus("docx render failed","err"); }
}

async function renderPlain(name){
  const { data } = await api("/api/preview_source?name=" + encodeURIComponent(name));
  const pv = $("#preview");
  if(data && data.text !== undefined){
    pv.innerHTML = `<div class="plain-preview"></div>`;
    pv.firstChild.textContent = data.text;
  } else {
    pv.innerHTML = `<div class="preview-placeholder">${(data&&data.error)||"no preview"}</div>`;
  }
}

async function renderSourceText(){
  if(!currentSrc){ setStatus("no source selected","err"); return; }
  renderPlain(currentSrc);
}

function setSeg(){
  document.querySelectorAll("#mode-seg button").forEach(b=>
    b.classList.toggle("on", b.dataset.mode === mode));
}
document.querySelectorAll("#mode-seg button").forEach(b=>{
  b.onclick = ()=>{
    mode = b.dataset.mode; setSeg();
    if(mode === "source") renderSourceText();
    else if(currentSrc) selectDoc(currentSrc, "." + currentSrc.split(".").pop());
    else if(currentTex){ const p = currentTex.replace(/\.tex$/,".pdf"); renderPdf(p); }
  };
});

async function handleFiles(files){
  for(const f of files){
    setStatus("uploading " + f.name + "...");
    const fd = new FormData(); fd.append("file", f);
    const { data, ok } = await api("/api/upload", { method:"POST", body: fd });
    if(!ok){ setStatus("upload failed: " + (data&&data.error||f.name), "err"); continue; }
    const saved = data.saved;
    setStatus("uploaded " + saved + " - converting...");
    const conv = await api("/api/convert", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ source: saved })
    });
    if(conv.ok && conv.data.created){
      setStatus("converted -> " + conv.data.created, "ok");
      currentSrc = saved;
    } else {
      setStatus("convert: " + (conv.data&&conv.data.error||"failed"), "err");
    }
  }
  await refreshDocs();
}

$("#dropzone").onclick = ()=> $("#file-input").click();
$("#file-input").onchange = e=> handleFiles(e.target.files);
["dragover","dragleave","drop"].forEach(ev=>{
  $("#dropzone").addEventListener(ev, e=>{
    e.preventDefault();
    $("#dropzone").classList.toggle("drag", ev==="dragover");
    if(ev==="drop") handleFiles(e.dataTransfer.files);
  });
});

$("#btn-save").onclick = async ()=>{
  if(!currentTex){ setStatus("no .tex open to save","err"); return; }
  const { data, ok } = await api("/api/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name: currentTex, content: editor.getValue() })
  });
  setStatus(ok ? "saved " + currentTex : ("save failed: " + (data&&data.error)), ok?"ok":"err");
};

$("#btn-compile").onclick = async ()=>{
  if(!currentTex){ setStatus("select a .tex document first","err"); return; }
  setStatus("saving...");
  await api("/api/save", { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name: currentTex, content: editor.getValue() }) });
  setStatus("compiling " + currentTex + "...");
  const { data, ok } = await api("/api/compile", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name: currentTex, passes: 2 })
  });
  if(ok && data.success){
    setStatus("compiled -> " + data.pdf, "ok");
    mode = "pdf"; setSeg();
    renderPdf(data.pdf);
    $("#prev-fname").textContent = data.pdf;
    refreshDocs();
  } else {
    setStatus("compile failed", "err");
    const pv = $("#preview");
    pv.innerHTML = `<div class="plain-preview" style="border-color:#5a2a2a;color:#f0a0a0"></div>`;
    pv.firstChild.textContent = (data && data.log_tail) || "pdflatex failed";
  }
};

window.addEventListener("DOMContentLoaded", ()=>{
  editor = CodeMirror.fromTextArea($("#editor"), {
    mode: "stex", theme: "material-darker", lineNumbers: true,
    lineWrapping: true, matchBrackets: true, autoCloseBrackets: true,
    placeholder: "\\documentclass{article} ..."
  });
  refreshDocs();
  setStatus("ready");
});
</script>
</body>
</html>
