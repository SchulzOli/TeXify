description: >-
  Cover page for job applications (or quotes/reports): position and company,
  optional photo, contact details and the list of enclosed documents.
  Combine: texify build cover.md letter.md cv.md -o application.pdf
fields:
  name: {required: true, description: Full name}
  title: Document type (default 'Application')
  position: Position, e.g. 'Solution Architect'
  company: Company
  reference: Job reference
  headline: Line below the name
  photo: Photo (image file)
  contact: "Contact: {address, phone, email, web}"
  contents: List of enclosed documents
strings:
  de:
    title: Bewerbung
    at: bei
    reference: Kennziffer
    contents: Unterlagen
  en:
    title: Application
    at: at
    reference: Reference
    contents: Contents
