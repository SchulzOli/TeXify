description: >-
  General document: report, concept, notes, how-to, specification, press
  release. Headings, lists, tables and images come straight from Markdown.
  The title comes from the field title or the first "# heading".
title_from_heading: true
fields:
  title: Title (alternatively the first heading "# ...")
  subtitle: Subtitle
  author: Author
  date: Date (YYYY-MM-DD, 'today' or free text)
  numbered: Number the sections (true/false)
  toc: Show a table of contents (true/false)
defaults:
  numbered: false
  toc: false
