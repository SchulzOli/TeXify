description: >-
  Certificate / award / diploma in landscape format with frame and
  ornaments: large title, highlighted name, short text, place/date,
  certificate number and up to three signatures.
fields:
  person: {required: true, description: Name of the recipient}
  title: Title (default 'Certificate')
  subtitle: Subtitle (e.g. course name)
  intro: Sentence before the name (default 'This is to certify that')
  signers: "Signatories: list of {name, role}"
  place: Place
  date: Date (default today)
  number: Certificate number
  logo: Logo image file
  ornaments: Show corner ornaments (true/false)
defaults:
  date: today
  ornaments: true
strings:
  de:
    title: Zertifikat
    intro: Hiermit wird bestätigt, dass
    number: Zertifikat-Nr.
  en:
    title: Certificate
    intro: This is to certify that
    number: Certificate no.
