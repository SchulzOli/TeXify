description: >-
  Project proposal / grant application / concept: title block, key-facts box
  (facts), numbered sections from Markdown, optional budget table with an
  automatically calculated total and a signature line.
title_from_heading: true
fields:
  title: {required: true, description: Project title (or first heading "# ...")}
  subtitle: Subtitle
  kind: Document type above the title (default 'Project proposal')
  applicant: Applicant
  facts: "Key facts as Label: Value (e.g. Duration: 01/2027 – 12/2027)"
  budget: "Budget: list of {item, amount, note}"
  budget_title: Heading of the budget
  numbered: Number the sections (default true)
  signature_line: Place/date + signature line at the end (true/false)
  place: Place for the signature line
  date: Date (default today)
defaults:
  numbered: true
  signature_line: false
  date: today
strings:
  de:
    proposal: Projektantrag
    budget: Kosten- und Finanzierungsplan
    position: Position
    amount: Betrag
    total: Gesamtsumme
    place_date: Ort, Datum
    signature: Unterschrift
  en:
    proposal: Project proposal
    budget: Budget
    position: Item
    amount: Amount
    total: Total
    place_date: Place, date
    signature: Signature
