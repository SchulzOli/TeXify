description: >-
  Invitation to an event, party, anniversary, workshop or general meeting:
  coloured title banner, prominent date/time/venue, invitation text,
  optional programme and RSVP box.
title_from_heading: true
fields:
  title: {required: true, description: Name of the event (or first heading)}
  subtitle: Subtitle / occasion
  kind: Line above the title (default 'Invitation')
  date: {required: true, description: Date}
  time: Time (e.g. '6 pm')
  place_name: Name of the venue (e.g. 'Town Hall')
  place: Address, several lines
  program: "Programme: list of {time, item}"
  rsvp: RSVP by / to
  dress_code: Dress code
  host: Host (footer)
strings:
  de:
    invitation: Einladung
    when: Datum
    time: Uhrzeit
    where: Ort
    program: Ablauf
    rsvp: Rückmeldung
    dress_code: Dresscode
  en:
    invitation: Invitation
    when: Date
    time: Time
    where: Venue
    program: Programme
    rsvp: RSVP
    dress_code: Dress code
