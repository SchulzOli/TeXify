description: >-
  Classic tabular CV: dates on the left, content on the right. Convention:
  "# Section" for categories, "## Period | Position, Company" for entries,
  bullet points below. Uses the same Markdown as cv-cards.
fields:
  name: {required: true, description: Full name}
  headline: Line below the name (e.g. job title)
  photo: Photo (image file, optional)
  contact: "Contact: {address, phone, email, web, linkedin, github, city}"
  details: "Personal details as Label: Value (e.g. Date of birth: 1 Jan 1990)"
  details_title: Heading for details (default 'Personal details')
  signature_line: Place, date and signature line at the end (true/false)
  place: Place for the signature line (default contact.city)
  date: Date for the signature line
  date_width: Width of the date column (default 3.4cm)
defaults:
  date: today
  date_width: 3.4cm
  signature_line: false
headings:
  1: cvsection
  2: {cmd: cventry, args: 2, split: "|", pad: start}
  3: cvsub
strings:
  de:
    cv: Lebenslauf
    details: Persönliche Daten
  en:
    cv: Curriculum Vitae
    details: Personal details
