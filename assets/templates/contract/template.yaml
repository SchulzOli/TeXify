description: >-
  Contract (service, work, rental, cooperation or freelance agreement):
  parties, automatically numbered clauses (§ 1 / Clause 1 …) from the
  headings, paragraphs (1), (2) from numbered lists and signature blocks for
  all parties.
title_from_heading: true
fields:
  title: {required: true, description: Contract title (or first heading "# ...")}
  subtitle: Subtitle
  parties: {required: true, description: "Parties: list of {role, name, address, rep, signatory, place}"}
  preamble: Preamble (Markdown)
  place: Place for the signatures
  date: Date (empty = line to fill in)
defaults:
  font: serif
headings:
  1: clause
  2: subclause
strings:
  de:
    between: "Zwischen"
    and: "und"
    hereinafter_pre: "nachfolgend „"
    hereinafter_post: "“ genannt"
    represented_by: "vertreten durch"
    agree: "wird folgender Vertrag geschlossen:"
    preamble: Präambel
    page: Seite
    clause: "§"
  en:
    between: "This agreement is made between"
    and: "and"
    hereinafter_pre: "hereinafter “"
    hereinafter_post: "”"
    represented_by: "represented by"
    agree: "The parties agree as follows:"
    preamble: Preamble
    page: Page
    clause: Clause
