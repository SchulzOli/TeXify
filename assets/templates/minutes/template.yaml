description: >-
  Meeting minutes / agenda: header box, agenda generated automatically from
  the headings, numbered agenda items, action items (who, what, by when) and
  optional signatures.
title_from_heading: true
fields:
  title: {required: true, description: Meeting title (or first heading "# ...")}
  kind: Document type above the title (default 'Minutes', e.g. 'Agenda')
  date: Date of the meeting
  time: Time (e.g. '10:00 – 11:30')
  place: Location / room / video call
  chair: Chair
  recorder: Minute taker
  attendees: List of attendees
  absent: List of apologies
  guests: List of guests
  actions: "Action items: list of {task, owner, due}"
  next_meeting: Next meeting
  signatures: Signature lines for chair and minute taker (true/false)
defaults:
  signatures: false
headings:
  1: agendaitem
  2: agendasub
strings:
  de:
    minutes: Protokoll
    item: TOP
    date: Datum
    place: Ort
    chair: Leitung
    recorder: Protokoll
    attendees: Anwesend
    absent: Entschuldigt
    guests: Gäste
    agenda: Tagesordnung
    actions: Aufgaben
    task: Aufgabe
    owner: Verantwortlich
    due: Termin
    next_meeting: Nächste Sitzung
  en:
