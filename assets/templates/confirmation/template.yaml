description: >-
  Confirmation / attestation / reference (e.g. certificate of attendance,
  employment reference, power of attorney, payment confirmation):
  letterhead, large title, optionally a highlighted person, Markdown text,
  place/date and signature lines.
title_from_heading: true
fields:
  sender.name: {required: true, description: "Issuer (texify.toml [defaults.sender])"}
  title: Title (default 'Confirmation' or the first heading "# ...")
  subtitle: Subtitle
  person: Person the document is about (highlighted)
  intro: Sentence above the name (default 'We hereby confirm that'; "" = none)
  person_details: Extra lines about the person (e.g. date of birth)
  logo: Logo image file (optional)
  signature: Signature image file (optional)
  signer: "Signatory: {name, role} (default sender.name)"
  place: Place (default sender.city)
  date: Date (default today)
defaults:
  date: today
headings:
  1: texifyheading
strings:
  de:
    title: Bestätigung
    hereby: Hiermit bestätigen wir, dass
    place_date: Ort, Datum
  en:
    title: Confirmation
    hereby: We hereby confirm that
    place_date: Place, date
