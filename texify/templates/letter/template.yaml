description: >-
  Business letter in DIN 5008 layout (KOMA-Script, window envelope ready):
  cover letter, cancellation, complaint, enquiry, payment reminder. Store
  the sender once in texify.toml under [defaults.sender].
fields:
  sender.name: {required: true, description: "Sender name (texify.toml [defaults.sender])"}
  sender.street: {required: true, description: Sender street and number}
  sender.zip: {required: true, description: Sender postcode}
  sender.city: {required: true, description: Sender city}
  sender.phone: Phone
  sender.email: E-mail
  sender.web: Website
  recipient: {required: true, description: "Recipient address, several lines (YAML: recipient: |)"}
  subject: Subject line
  date: Date (default today)
  place: Place before the date (default sender.city)
  opening: Salutation (default 'Dear Sir or Madam,')
  closing: Closing (default 'Kind regards')
  signature: Image file of the signature (optional)
  enclosures: List of enclosures
  your_ref: Your reference
  your_letter: Date of your letter
  my_ref: Our reference
defaults:
  date: today
headings:
  1: texifyheading
strings:
  de:
    opening: Sehr geehrte Damen und Herren,
    closing: Mit freundlichen Grüßen
    enclosures: Anlagen
  en:
    opening: Dear Sir or Madam,
    closing: Kind regards
    enclosures: Enclosures
