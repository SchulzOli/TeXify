description: >-
  Geschäftsbrief nach DIN 5008 (KOMA-Script): Bewerbungsanschreiben,
  Kündigung, Anfrage, Widerspruch ... Absender am besten einmalig in
  texify.toml unter [defaults.sender] hinterlegen.
fields:
  sender.name: {required: true, description: "Absender-Name (texify.toml [defaults.sender])"}
  sender.street: {required: true, description: Absender Straße + Nr.}
  sender.zip: {required: true, description: Absender PLZ}
  sender.city: {required: true, description: Absender Ort}
  sender.phone: Telefon
  sender.email: E-Mail
  sender.web: Webseite
  recipient: {required: true, description: "Empfängeradresse, mehrzeilig (YAML: recipient: |)"}
  subject: Betreffzeile
  date: Datum (Standard heute)
  place: Ort vor dem Datum (Standard sender.city)
  opening: Anrede (Standard 'Sehr geehrte Damen und Herren,')
  closing: Grußformel (Standard 'Mit freundlichen Grüßen')
  signature: Bilddatei der Unterschrift (optional)
  enclosures: Liste der Anlagen
  your_ref: Ihr Zeichen
  your_letter: Datum Ihres Schreibens
  my_ref: Unser Zeichen
defaults:
  date: today
headings:
  1: texifyheading
strings:
  de:
    opening: Sehr geehrte Damen und Herren,
    closing: Mit freundlichen Grüßen
    enclosures: Anlagen
  en:
    opening: Dear Sir or Madam,
    closing: Kind regards
    enclosures: Enclosures
