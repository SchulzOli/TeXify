description: >-
  Modern two-column CV with soft grey cards (sidebar + main column). Same
  Markdown as 'cv': "# Section", "## Period | Position, Company". The field
  sidebar decides which sections go into the sidebar.
fields:
  name: {required: true, description: Full name}
  headline: Line below the name (default 'Curriculum Vitae')
  photo: Photo (image file, optional)
  contact: "Contact: {phone, email, address, web, linkedin, github}"
  sidebar: List of section titles for the sidebar
  card_color: Card background colour (hex, default ECECEC)
defaults:
  card_color: ECECEC
headings:
  1: cvsection
  2: {cmd: cventry, args: 2, split: "|", pad: start}
  3: cvsub
strings:
  de:
    cv: Lebenslauf
    contact: Kontakt
    sidebar_default: [Kenntnisse, Skills, Sprachen, Über mich, Interessen, Zertifikate]
  en:
    cv: Curriculum Vitae
    contact: Contact
    sidebar_default: [Skills, Languages, About me, Interests, Certificates]
