description: >-
  Rechnung oder Angebot (kind: quote) mit Positionstabelle; Zwischensummen, USt und Gesamtbetrag werden
  exakt berechnet (Decimal). Enthält die Pflichtangaben nach §14 UStG,
  optional Kleinunternehmerregelung (§19 UStG). Absender/Bank/Steuernummer
  am besten in texify.toml [defaults.sender] hinterlegen.
fields:
  sender.name: {required: true, description: "Rechnungssteller (texify.toml [defaults.sender])"}
  sender.street: {required: true, description: Straße + Nr.}
  sender.zip: {required: true, description: PLZ}
  sender.city: {required: true, description: Ort}
  sender.tax_id: Steuernummer (oder sender.vat_id)
  sender.vat_id: USt-IdNr.
  sender.bank: "Bankverbindung: {name, iban, bic}"
  recipient: {required: true, description: "Rechnungsempfänger, mehrzeilig (YAML: recipient: |)"}
  kind: "invoice (Rechnung, Standard) oder quote (Angebot mit Gültigkeitsdatum)"
  number: {required: true, description: Rechnungs- bzw. Angebotsnummer}
  valid_days: Angebot gültig für n Tage (Standard 30)
  date: Rechnungsdatum (Standard heute)
  customer_number: Kundennummer
  service_date: Leistungsdatum
  service_period: Leistungszeitraum (freier Text, z. B. 'September 2026')
  items: {required: true, description: "Positionen: Liste aus {desc, qty, unit, price, detail}"}
  vat: USt-Satz in Prozent (Standard 19)
  small_business: Kleinunternehmer nach §19 UStG – keine USt (true/false)
  due_days: Zahlungsziel in Tagen (Standard 14)
  payment_note: Eigener Zahlungshinweis statt des Standardtexts
  opening: Anrede
  closing: Grußformel
defaults:
  kind: invoice
  valid_days: 30
  date: today
  vat: 19
  due_days: 14
  small_business: false
headings:
  1: texifyheading
