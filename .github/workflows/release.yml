name: Release

# Push a tag like v0.3.0 to build single-binary releases for Linux, Windows and macOS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin texify --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=texify-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md THIRD_PARTY.md "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/${{ matrix.target }}/release/texify.exe "$name"/
            7z a "$name.zip" "$name" > /dev/null
          else
            cp target/${{ matrix.target }}/release/texify "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: texify-*.${{ matrix.archive }}
