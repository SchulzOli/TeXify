name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: matrix.os == 'ubuntu-latest'
      - name: Tests (compile tests are skipped without a LaTeX engine)
        run: cargo test --workspace
      - run: cargo xtask third-party --check
        if: matrix.os == 'ubuntu-latest'

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build TeX Live image
        run: docker build -t texify:latest .
      - name: Compile tests + all examples
        env:
          TEXIFY_ENGINE: docker
        run: |
          cargo test --workspace
          cargo xtask examples
      - uses: actions/upload-artifact@v4
        with:
          name: example-pdfs
          path: examples/pdf/*.pdf
